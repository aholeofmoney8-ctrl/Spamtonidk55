<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[[BIG SHOT]] MASTER OS 1997</title>
    <style>
        body {
            background-color: #000000;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding: 20px 10px;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .arcade-cabinet {
            background: #111111;
            border: 6px ridge #333333;
            width: 320px;
            padding: 20px 10px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
            position: relative;
        }
        .spamton-face {
            width: 140px;
            height: 70px;
            margin: 10px auto 15px auto;
            position: relative;
        }
        .glass-left {
            background: #ff00ff;
            width: 55px;
            height: 45px;
            position: absolute;
            left: 5px;
            border-radius: 5px;
            box-shadow: 0 0 15px #ff00ff;
        }
        .glass-right {
            background: #ffff00;
            width: 55px;
            height: 45px;
            position: absolute;
            right: 5px;
            border-radius: 5px;
            box-shadow: 0 0 15px #ffff00;
        }
        .glasses-bridge {
            background: #ffffff;
            width: 20px;
            height: 8px;
            position: absolute;
            left: 60px;
            top: 18px;
        }
        .hud-panel {
            background: #000000;
            border: 2px dashed #ffff00;
            padding: 10px;
            width: 270px;
            margin: 0 auto 20px auto;
            border-radius: 4px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .hud-stat {
            display: flex;
            flex-direction: column;
        }
        .hud-label {
            color: #00ffff;
            font-size: 0.65rem;
            letter-spacing: 1px;
            margin-bottom: 3px;
        }
        .hud-value {
            font-size: 1.1rem;
            font-weight: bold;
            margin: 0;
        }
        #looseKromer { color: #00ff00; text-shadow: 0 0 5px #00ff00; }
        #cardBalance { color: #ffff00; text-shadow: 0 0 5px #ffff00; }
        .stage {
            display: none !important;
        }
        .stage.visible {
            display: block !important;
        }
        h1 {
            color: #ffff00;
            font-size: 2.1rem;
            text-shadow: 3px 3px #ff00ff;
            margin: 0 0 20px 0;
            line-height: 1.1;
        }
        .menu-list {
            list-style: none;
            padding: 0;
            margin: 25px 0;
        }
        .menu-item {
            font-size: 1.6rem;
            color: #ffffff;
            margin: 15px 0;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
        }
        .menu-item:hover {
            color: #ffff00;
            transform: scale(1.08);
            text-shadow: 0 0 10px #ff00ff;
        }
        .menu-item::before { content: "[[ "; color: #00ffff; }
        .menu-item::after { content: " ]]"; color: #00ffff; }
        .action-btn {
            background: #000000;
            border: 2px solid #00ff00;
            color: #00ff00;
            padding: 10px 20px;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin: 10px auto;
            display: block;
            box-shadow: 0 4px #005500;
            width: 85%;
        }
        .action-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px #005500;
        }
        .bank-btn {
            border-color: #ffff00;
            color: #ffff00;
            box-shadow: 0 4px #555500;
            margin-bottom: 25px;
        }
        .bank-btn:active { box-shadow: 0 2px #555500; }
        .outer-panel {
            background-color: #D3D3D3;
            width: 240px;
            margin: 20px auto;
            padding: 15px;
            border-radius: 4px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
        }
        .inner-panel {
            background-color: #808080;
            padding: 15px;
        }
        .card-slot {
            background-color: #000000;
            width: 160px;
            height: 28px;
            margin: 0 auto;
            box-shadow: inset 0 0 8px #000000;
        }
        .card-container {
            width: 100%;
            height: 110px;
            position: relative;
            margin-top: 15px;
        }
        .credit-card {
            background: linear-gradient(135deg, #ffff00, #ff00ff);
            width: 130px;
            height: 80px;
            margin: 0 auto;
            border-radius: 6px;
            cursor: pointer;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 0;
            box-shadow: 0 5px 10px rgba(0,0,0,0.5);
            transition: transform 0.5s cubic-bezier(0.19, 1, 0.22, 1), opacity 0.5s;
        }
        .card-swallowed {
            transform: translateX(-50%) translateY(-105px) scale(0.1, 0);
            opacity: 0;
        }
        .back-btn {
            background: none;
            border: 2px solid #ff00ff;
            color: #ff00ff;
            padding: 8px 15px;
            font-family: monospace;
            cursor: pointer;
            margin-top: 20px;
        }
        .back-btn:hover { background: #ff00ff; color: #000000; }
        .setting-row { margin: 18px 0; font-size: 1.1rem; }
    </style>
</head>
<body>
    <div class="arcade-cabinet">
        <div class="spamton-face">
            <div class="glass-left"></div>
            <div class="glasses-bridge"></div>
            <div class="glass-right"></div>
        </div>
        <div class="hud-panel">
            <div class="hud-stat">
                <span class="hud-label">[[LOOSE KROMER]]</span>
                <span class="hud-value" id="looseKromer">0</span>
            </div>
            <div class="hud-stat">
                <span class="hud-label">[[CARD BALANCE]]</span>
                <span class="hud-value" id="cardBalance">$0</span>
            </div>
        </div>
        <div id="menuStage" class="stage visible">
            <h1>SPAMTON OS v1.997</h1>
            <button class="action-btn" onclick="mineKromer()">GATHER [[Kromer]]</button>
            <ul class="menu-list">
                <li class="menu-item" onclick="showStage('gameStage')">Play</li>
                <li class="menu-item" onclick="showStage('settingsStage')">Settings</li>
                <li class="menu-item" onclick="exitSystem()">Exit</li>
            </ul>
        </div>
        <div id="gameStage" class="stage">
            <h1 style="font-size: 1.5rem; color: #00ffff;">[[ATM NETWORK]]</h1>
            <button class="action-btn bank-btn" onclick="saveToCard()">SAVE KROMER TO [[Card]]</button>
            <div class="outer-panel">
                <div class="inner-panel">
                    <div class="card-slot"></div>
                </div>
            </div>
            <div class="card-container">
                <div class="credit-card" id="spamtonCard" onclick="insertCard()"></div>
            </div>
            <button class="back-btn" onclick="showStage('menuStage')">BACK TO MENU</button>
        </div>
        <div id="settingsStage" class="stage">
            <h1>[[CONFIGURATION]]</h1>
            <div class="setting-row">
                <label>AUDIO: </label> <span style="color: #ff00ff;">[HYPERLINK BLOCKED]</span>
            </div>
            <div class="setting-row">
                <label>KROMER RATE: </label> <span style="color: #ffff00;">MAXIMUM</span>
            </div>
            <div class="setting-row">
                <label>JEVIL RADAR: </label> <span style="color: #ff0000; font-weight: bold;">DISABLED 🚨</span>
            </div>
            <button class="back-btn" onclick="showStage('menuStage')">BACK TO MENU</button>
        </div>
    </div>
    <script>
        let looseKromer = localStorage.getItem('looseKromer') ? parseInt(localStorage.getItem('looseKromer')) : 0;
        let cardBalance = localStorage.getItem('cardBalance') ? parseInt(localStorage.getItem('cardBalance')) : 0;
        updateHUD();

        function showStage(stageId) {
            if(stageId === 'gameStage') {
                const card = document.getElementById('spamtonCard');
                if (card) card.classList.remove('card-swallowed');
            }
            document.querySelectorAll('.stage').forEach(el => { el.classList.remove('visible'); });
            document.getElementById(stageId).classList.add('visible');
        }
        function mineKromer() {
            let mined = Math.floor(Math.random() * 15) + 5;
            looseKromer += mined;
            localStorage.setItem('looseKromer', looseKromer);
            updateHUD();
        }
        function saveToCard() {
            if(looseKromer <= 0) {
                alert("YOUR POCKETS ARE [[Empty]]! GATHER [[Kromer]] FIRST!");
                return;
            }
            cardBalance += looseKromer;
            looseKromer = 0;
            localStorage.setItem('looseKromer', looseKromer);
            localStorage.setItem('cardBalance', cardBalance);
            updateHUD();
            alert("SUCCESS! [[Kromer]] SECURELY ENCRYPTED.");
        }
        function insertCard() {
            const card = document.getElementById('spamtonCard');
            if (card) card.classList.add('card-swallowed');
            setTimeout(() => {
                if(cardBalance <= 0) {
                    alert("...WAIT A SEC. THIS CARD HAS [[$0.00]] Balance?! YOU ARE TRYING TO SCAM THE SALESMAN!");
                } else if(cardBalance > 0 && cardBalance < 100) {
                    alert("THANK YOU FOR THE DEPOSIT! YOUR VALUE OF [$" + cardBalance + "] HAS BEEN EXCHANGED FOR POOR QUALITY CAR INSURANCE.");
                } else if(cardBalance >= 100 && cardBalance < 1000) {
                    alert("HAEAEAEAEAEA!!! NOW THAT'S WHAT I CALL A [$" + cardBalance + "] GENEROSITY!! YOU'RE TURNING INTO A REAL [[Big Shot]]!");
                } else {
                    alert("🚨 ALARMS BLARING 🚨\n\nUNBELIEVABLE! [$" + cardBalance + "] KROMER DELIVERED DIRECTLY INTO THE DUMPSTER! YOU HAVE BROKEN THE CYBER ECONOMY!!!");
                }
                cardBalance = 0;
                localStorage.setItem('cardBalance', cardBalance);
                updateHUD();
                showStage('menuStage');
            }, 550);
        }
        function updateHUD() {
            const looseEl = document.getElementById('looseKromer');
            const balanceEl = document.getElementById('cardBalance');
            if (looseEl) looseEl.innerText = looseKromer;
            if (balanceEl) balanceEl.innerText = "$" + cardBalance;
        }
        function exitSystem() {
            alert("HAEAEAEAEAEA!!! YOU THINK YOU CAN [[Exit]] THE SALES PROGRAM?! THERE IS NO ESCAPE FROM THE DUMPSTER!");
        }
    </script>
</body>
</html>
