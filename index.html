<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[[BIG SHOT]] SYSTEM 1997</title>
    <style>
        /* Cyber World Base Styling */
        body {
            background-color: #000000;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding: 30px 10px;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* CRT Arcade Screen Container */
        .arcade-cabinet {
            background: #111;
            border: 6px ridge #333;
            width: 360px;
            padding: 20px 10px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
            position: relative;
        }

        /* Glitchy Heading */
        h1 {
            color: #ffff00;
            font-size: 2.2rem;
            text-shadow: 3px 3px #ff00ff;
            margin: 0 0 20px 0;
            line-height: 1.1;
        }

        /* --- PURE CSS SPAMTON FACE --- */
        .spamton-face {
            width: 140px;
            height: 70px;
            margin: 10px auto 25px auto;
            position: relative;
        }
        /* Iconic Pink & Yellow Glasses */
        .glass-left {
            background: #ff00ff;
            width: 55px;
            height: 45px;
            position: absolute;
            left: 5px;
            border-radius: 5px;
            box-shadow: 0 0 15px #ff00ff;
        }
        .glass-right {
            background: #ffff00;
            width: 55px;
            height: 45px;
            position: absolute;
            right: 5px;
            border-radius: 5px;
            box-shadow: 0 0 15px #ffff00;
        }
        .glasses-bridge {
            background: #ffffff;
            width: 20px;
            height: 8px;
            position: absolute;
            left: 60px;
            top: 18px;
        }

        /* --- SCREEN STATES --- */
        .screen {
            display: none;
            min-height: 250px;
        }
        .screen.active {
            display: block;
        }

        /* --- MAIN MENU OPTIONS --- */
        .menu-list {
            list-style: none;
            padding: 0;
            margin: 30px 0;
        }
        .menu-item {
            font-size: 1.6rem;
            color: #ffffff;
            margin: 15px 0;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
        }
        .menu-item:hover {
            color: #ffff00;
            transform: scale(1.1);
            text-shadow: 0 0 10px #ff00ff;
        }
        .menu-item::before {
            content: "[[ ";
            color: #00ffff;
        }
        .menu-item::after {
            content: " ]]";
            color: #00ffff;
        }

        /* --- GAME SCREEN (YOUR CARD SLOT) --- */
        .outer-panel {
            background-color: #D3D3D3;
            width: 280px;
            margin: 0 auto;
            padding: 20px;
            border-radius: 4px;
        }
        .inner-panel {
            background-color: #808080;
            padding: 15px;
        }
        .card-slot {
            background-color: #000000;
            width: 180px;
            height: 28px;
            margin: 0 auto;
        }
        .card-container {
            width: 100%;
            height: 110px;
            position: relative;
            margin-top: 20px;
        }
        .credit-card {
            background: linear-gradient(135deg, #ffff00, #ff00ff);
            width: 130px;
            height: 80px;
            margin: 0 auto;
            border-radius: 6px;
            cursor: pointer;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 0;
            transition: transform 0.6s cubic-bezier(0.19, 1, 0.22, 1), opacity 0.6s;
        }
        .card-swallowed {
            transform: translateX(-50%) translateY(-100px) scale(0.1, 0);
            opacity: 0;
        }

        /* UI Navigation Buttons */
        .back-btn {
            background: none;
            border: 2px solid #ff00ff;
            color: #ff00ff;
            padding: 8px 15px;
            font-family: monospace;
            cursor: pointer;
            margin-top: 20px;
        }
        .back-btn:hover {
            background: #ff00ff;
            color: #000;
        }

        /* Settings adjustments */
        .setting-row {
            margin: 20px 0;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="arcade-cabinet">
        
        <!-- Spamton Glasses Asset -->
        <div class="spamton-face">
            <div class="glass-left"></div>
            <div class="glasses-bridge"></div>
            <div class="glass-right"></div>
        </div>

        <!-- 1. MAIN MENU SCREEN -->
        <div id="menuScreen" class="screen active">
            <h1>SPAMTON OS v1.997</h1>
            <ul class="menu-list">
                <li class="menu-item" onclick="changeScreen('gameScreen')">Play</li>
                <li class="menu-item" onclick="changeScreen('settingsScreen')">Settings</li>
                <li class="menu-item" onclick="exitSystem()">Exit</li>
            </ul>
        </div>

        <!-- 2. GAME PLAY SCREEN (Your Hardware Slot) -->
        <div id="gameScreen" class="screen">
            <h1 style="font-size: 1.6rem; color: #00ffff;">[[DEAL OR NO DEAL]]</h1>
            
            <div class="outer-panel">
                <div class="inner-panel">
                    <div class="card-slot"></div>
                </div>
            </div>

            <div class="card-container">
                <div class="credit-card" id="spamtonCard" onclick="insertCard()"></div>
            </div>
            
            <button class="back-btn" onclick="changeScreen('menuScreen')">BACK TO MENU</button>
        </div>

        <!-- 3. SETTINGS SCREEN -->
        <div id="settingsScreen" class="screen">
            <h1>[[CONFIGURATION]]</h1>
            <div class="setting-row">
                <label>AUDIO: </label>
                <span style="color: #ff00ff;">[HYPERLINK BLOCKED]</span>
            </div>
            <div class="setting-row">
                <label>KROMER RATE: </label>
                <span style="color: #ffff00;">MAXIMUM</span>
            </div>
            <div class="setting-row">
                <label>JEVIL RADAR: </label>
                <span style="color: #ff0000; font-weight: bold;">DISABLED 🚨</span>
            </div>
            <button class="back-btn" onclick="changeScreen('menuScreen')">BACK TO MENU</button>
        </div>

    </div>

    <script>
        // Screen Navigation Engine
        function changeScreen(screenId) {
            // Reset card animation if navigating away/back
            if(screenId === 'gameScreen') {
                const card = document.getElementById('spamtonCard');
                card.classList.remove('card-swallowed');
            }
            
            // Hide all screens
            document.querySelectorAll('.screen').forEach(s => {
                s.classList.remove('active');
            });
            // Show chosen screen
            document.getElementById(screenId).classList.add('active');
        }

        // Swallowing Mechanic
        function insertCard() {
            const card = document.getElementById('spamtonCard');
            card.classList.add('card-swallowed');
            
            setTimeout(() => {
                alert("THANK YOU FOR THE [[Generous Donation]]!!! YOU ARE NOW FULLY [[Big Shot]] INSURED!");
                changeScreen('menuScreen');
            }, 600);
        }

        // Exit Script
        function exitSystem() {
            alert("HAEAEAEAEAEA!!! YOU THINK YOU CAN [[Exit]] THE SALES PROGRAM?! THERE IS NO ESCAPE FROM THE DUMPSTER!");
        }
    </script>

</body>
</html>
