<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[[BIG SHOT]] INSURANCE DEALS 1997</title>
    <style>
        body {
            background-color: #000000;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding: 50px 20px;
            overflow-x: hidden;
        }

        h1 {
            color: #ffff00;
            font-size: 2.8rem;
            text-shadow: 3px 3px #ff00ff;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #00ffff;
            font-size: 1.4rem;
            margin-bottom: 40px;
        }

        /* --- YOUR HARDWARE DESIGN LAYOUT --- */
        .outer-panel {
            background-color: #D3D3D3;
            width: 340px;
            margin: 0 auto;
            padding: 25px;
            border-radius: 4px;
            box-shadow: 0 0 25px rgba(255, 0, 255, 0.4);
        }

        .inner-panel {
            background-color: #808080;
            padding: 20px;
            border-radius: 2px;
        }

        .card-slot {
            background-color: #000000;
            width: 220px;
            height: 35px;
            margin: 0 auto;
            border-radius: 2px;
            position: relative;
            box-shadow: inset 0 0 10px #000;
        }

        /* --- THE INTERACTIVE CARD --- */
        .card-container {
            width: 100%;
            height: 150px;
            position: relative;
            margin-top: 30px;
        }

        .credit-card {
            background: linear-gradient(135deg, #ffff00, #ff00ff);
            width: 160px;
            height: 95px;
            margin: 0 auto;
            border-radius: 8px;
            cursor: pointer;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 10px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.6);
            transition: transform 0.6s cubic-bezier(0.19, 1, 0.22, 1), opacity 0.6s;
        }

        .card-chip {
            background: #ffd700;
            width: 22px;
            height: 18px;
            position: absolute;
            top: 15px;
            left: 15px;
            border-radius: 3px;
            box-shadow: inset 1px 1px 2px rgba(0,0,0,0.3);
        }

        .card-number {
            color: #000000;
            font-weight: bold;
            font-size: 0.75rem;
            position: absolute;
            bottom: 15px;
            left: 15px;
            letter-spacing: 1.5px;
        }

        /* --- ANIMATIONS --- */
        .card-swallowed {
            transform: translateX(-50%) translateY(-115px) scale(0.1, 0);
            opacity: 0;
        }
    </style>
</head>
<body>

    <h1>NOW'S YOUR CHANCE TO BE A [[BIG SHOT]]!!!</h1>
    <div class="subtitle">SLIDE IN YOUR LITTLE [[CreditCard]] FOR FREE HYPERLINK CAR INSURANCE!</div>

    <!-- The hardware block generated from your graphic structure -->
    <div class="outer-panel">
        <div class="inner-panel">
            <div class="card-slot"></div>
        </div>
    </div>

    <!-- The card field -->
    <div class="card-container">
        <div class="credit-card" id="spamtonCard" onclick="insertCard()">
            <div class="card-chip"></div>
            <div class="card-number">4199 1997 KROM ER</div>
        </div>
    </div>

    <script>
        function insertCard() {
            const card = document.getElementById('spamtonCard');
            card.classList.add('card-swallowed');
            
            setTimeout(() => {
                alert("THANK YOU FOR THE [[Generous Donation]]!!! YOUR KROMER IS NOW [Our Property]. \n\nYOU ARE NOW FULLY [[Insured]]!");
            }, 600);
        }
    </script>

</body>
</html>
