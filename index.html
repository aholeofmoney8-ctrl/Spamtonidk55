<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[[BIG SHOT]] TRACKER 1997</title>
    <style>
        body {
            background-color: #000000;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding: 20px 10px;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .arcade-cabinet {
            background: #111111;
            border: 6px ridge #333333;
            width: 340px;
            padding: 20px 10px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
            position: relative;
        }

        /* --- NEON SPAMTON LOGO ASSET --- */
        .spamton-face {
            width: 140px;
            height: 70px;
            margin: 10px auto 15px auto;
            position: relative;
        }
        .glass-left {
            background: #ff00ff;
            width: 55px;
            height: 45px;
            position: absolute;
            left: 5px;
            border-radius: 5px;
            box-shadow: 0 0 15px #ff00ff;
        }
        .glass-right {
            background: #ffff00;
            width: 55px;
            height: 45px;
            position: absolute;
            right: 5px;
            border-radius: 5px;
            box-shadow: 0 0 15px #ffff00;
        }
        .glasses-bridge {
            background: #ffffff;
            width: 20px;
            height: 8px;
            position: absolute;
            left: 60px;
            top: 18px;
        }

        /* --- THE PERMANENT KROMER COUNTER PANEL --- */
        .counter-box {
            background: #000000;
            border: 2px dashed #ffff00;
            padding: 8px;
            width: 280px;
            margin: 0 auto 20px auto;
            border-radius: 4px;
        }
        .counter-label {
            color: #00ffff;
            font-size: 0.8rem;
            letter-spacing: 1px;
            margin: 0 0 3px 0;
        }
        .counter-total {
            color: #ffff00;
            font-size: 1.5rem;
            font-weight: bold;
            margin: 0;
            text-shadow: 0 0 8px #ffff00;
        }

        /* --- CORE INTERFACE DISPLAY RIG --- */
        .stage {
            display: none !important;
        }
        .stage.visible {
            display: block !important;
        }

        h1 {
            color: #ffff00;
            font-size: 2.1rem;
            text-shadow: 3px 3px #ff00ff;
            margin: 0 0 20px 0;
            line-height: 1.1;
        }

        /* --- INTERACTIVE ACTION MENUS --- */
        .menu-list {
            list-style: none;
            padding: 0;
            margin: 25px 0;
        }
        .menu-item {
            font-size: 1.6rem;
            color: #ffffff;
            margin: 15px 0;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
        }
        .menu-item:hover {
            color: #ffff00;
            transform: scale(1.08);
            text-shadow: 0 0 10px #ff00ff;
        }
        .menu-item::before { content: "[[ "; color: #00ffff; }
        .menu-item::after { content: " ]]"; color: #00ffff; }

        /* --- RECREATION OF YOUR HARDWARE SCHEMATIC --- */
        .outer-panel {
            background-color: #D3D3D3;
            width: 260px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 4px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
        }
        .inner-panel {
            background-color: #808080;
            padding: 15px;
        }
        .card-slot {
            background-color: #000000;
            width: 170px;
            height: 28px;
            margin: 0 auto;
            box-shadow: inset 0 0 8px #000000;
        }

        /* --- THE SWIPEABLE PLASTIC CARD --- */
        .card-container {
            width: 100%;
            height: 110px;
            position: relative;
            margin-top: 15px;
        }
        .credit-card {
            background: linear-gradient(135deg, #ffff00, #ff00ff);
            width: 130px;
            height: 80px;
            margin: 0 auto;
            border-radius: 6px;
            cursor: pointer;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 0;
            box-shadow: 0 5px 10px rgba(0,0,0,0.5);
            transition: transform 0.5s cubic-bezier(0.19, 1, 0.22, 1), opacity 0.5s;
        }
        .card-swallowed {
            transform: translateX(-50%) translateY(-105px) scale(0.1, 0);
            opacity: 0;
        }

        /* --- TERMINAL CONTROL GEAR --- */
        .back-btn {
            background: none;
            border: 2px solid #ff00ff;
            color: #ff00ff;
            padding: 8px 15px;
            font-family: monospace;
            cursor: pointer;
            margin-top: 20px;
        }
        .back-btn:hover { background: #ff00ff; color: #000000; }
        .setting-row { margin: 18px 0; font-size: 1.1rem; }
    </style>
</head>
<body>

    <div class="arcade-cabinet">
        
        <!-- Glasses Emblem -->
        <div class="spamton-face">
            <div class="glass-left"></div>
            <div class="glasses-bridge"></div>
            <div class="glass-right"></div>
        </div>

        <!-- Global Transaction Metrics Panel -->
        <div class="counter-box">
            <p class="counter-label">[[TOTAL CARDS ACCEPTE D]]</p>
            <p class="counter-total" id="cardCounter">000000</p>
        </div>

        <!-- LAYOUT DISPLAY 1: MAIN ROOT INDEX -->
        <div id="menuStage" class="stage visible">
            <h1>SPAMTON OS v1.997</h1>
            <ul class="menu-list">
                <li class="menu-item" onclick="showStage('gameStage')">Play</li>
                <li class="menu-item" onclick="showStage('settingsStage')">Settings</li>
                <li class="menu-item" onclick="exitSystem()">Exit</li>
            </ul>
        </div>

        <!-- LAYOUT DISPLAY 2: TRANSACTION RIG (Your Design) -->
        <div id="gameStage" class="stage">
            <h1 style="font-size: 1.5rem; color: #00ffff;">[[DEAL OR NO DEAL]]</h1>
            
            <div class="outer-panel">
                <div class="inner-panel">
                    <div class="card-slot"></div>
                </div>
            </div>

            <div class="card-container">
                <div class="credit-card" id="spamtonCard" onclick="insertCard()"></div>
            </div>
            
            <button class="back-btn" onclick="showStage('menuStage')">BACK TO MENU</button>
        </div>

        <!-- LAYOUT DISPLAY 3: OPTIONS DESK -->
        <div id="settingsStage" class="stage">
            <h1>[[CONFIGURATION]]</h1>
            <div class="setting-row">
                <label>AUDIO: </label> <span style="color: #ff00ff;">[HYPERLINK BLOCKED]</span>
            </div>
            <div class="setting-row">
                <label>KROMER RATE: </label> <span style="color: #ffff00;">MAXIMUM</span>
            </div>
            <div class="setting-row">
                <label>JEVIL RADAR: </label> <span style="color: #ff0000; font-weight: bold;">DISABLED 🚨</span>
            </div>
            <button class="back-btn" onclick="showStage('menuStage')">BACK TO MENU</button>
        </div>

    </div>

    <script>
        // Internal Tracking Core Memory
        let swipeCount = localStorage.getItem('spamtonSwipeCount') ? parseInt(localStorage.getItem('spamtonSwipeCount')) : 0;
        updateCounterDisplay();

        function showStage(stageId) {
            if(stageId === 'gameStage') {
                const card = document.getElementById('spamtonCard');
                card.classList.remove('card-swallowed');
            }
            
            // Clean slate layout clear
            document.querySelectorAll('.stage').forEach(el => {
                el.classList.remove('visible');
            });
            
            document.getElementById(stageId).classList.add('visible');
        }

        function insertCard() {
            const card = document.getElementById('spamtonCard');
            card.classList.add('card-swallowed');
            
            // Register metrics sequence
            swipeCount++;
            localStorage.setItem('spamtonSwipeCount', swipeCount);
            
            setTimeout(() => {
                updateCounterDisplay();
                alert("THANK YOU FOR THE [[Generous Donation]]!!! YOU ARE NOW FULLY [[Big Shot]] INSURED!");
                showStage('menuStage');
            }, 550);
        }

        function updateCounterDisplay() {
            // Padding the number with zeros to maintain retro arcade style
            document.getElementById('cardCounter').innerText = String(swipeCount).padStart(6, '0');
        }

        function exitSystem() {
            alert("HAEAEAEAEAEA!!! YOU THINK YOU CAN [[Exit]] THE SALES PROGRAM?! THERE IS NO ESCAPE FROM THE DUMPSTER!");
        }
    </script>

</body>
</html>
<script>
// --- 1. CORE BANKING SYSTEMS ---
let looseKromer = localStorage.getItem('looseKromer') ? parseInt(localStorage.getItem('looseKromer')) : 0;
let cardBalance = localStorage.getItem('cardBalance') ? parseInt(localStorage.getItem('cardBalance')) : 0;

// Re-hook the HUD interface elements dynamically using code
function injectEconomyHUD() {
    const cabinet = document.querySelector('.arcade-cabinet');
    if (!cabinet) return;

    // Check if the HUD box already exists, if not, create it
    if (!document.getElementById('economyHUD')) {
        const hudHTML = `
            <div id="economyHUD" style="background: #000; border: 2px dashed #ffff00; padding: 10px; margin-bottom: 20px; display: grid; grid-template-columns: 1fr 1fr; border-radius: 4px;">
                <div>
                    <div style="color: #00ffff; font-size: 0.65rem; letter-spacing: 1px;">[[LOOSE KROMER]]</div>
                    <div style="color: #00ff00; font-size: 1.2rem; font-weight: bold;" id="looseKromer">0</div>
                </div>
                <div>
                    <div style="color: #00ffff; font-size: 0.65rem; letter-spacing: 1px;">[[CARD BALANCE]]</div>
                    <div style="color: #ffff00; font-size: 1.2rem; font-weight: bold;" id="cardBalance">$0</div>
                </div>
            </div>
            <button id="mineBtn" style="background: #000; border: 2px solid #00ff00; color: #00ff00; padding: 10px 20px; font-family: monospace; font-size: 1rem; font-weight: bold; cursor: pointer; border-radius: 4px; margin-bottom: 15px; width: 100%;" onclick="mineKromer()">
                GATHER [[Kromer]]
            </button>
        `;
        // Put the HUD and Gather button at the very top of the arcade screen
        const menuStage = document.getElementById('menuStage') || document.getElementById('menuScreen');
        if (menuStage) {
            menuStage.insertAdjacentHTML('afterbegin', hudHTML);
        }
    }

    // Check if the ATM Transfer button already exists inside gameplay screen, if not, create it
    const gameStage = document.getElementById('gameStage') || document.getElementById('gameScreen');
    if (gameStage && !document.getElementById('bankBtn')) {
        const bankButtonHTML = `
            <button id="bankBtn" style="background: #000; border: 2px solid #ffff00; color: #ffff00; padding: 10px 20px; font-family: monospace; font-size: 1rem; font-weight: bold; cursor: pointer; border-radius: 4px; margin-bottom: 15px; width: 100%;" onclick="saveToCard()">
                SAVE KROMER TO [[Card]]
            </button>
        `;
        gameStage.insertAdjacentHTML('afterbegin', bankButtonHTML);
    }
    
    updateHUD();
}

// --- 2. GAME LOGIC UTILITIES ---
function mineKromer() {
    let mined = Math.floor(Math.random() * 15) + 5;
    looseKromer += mined;
    localStorage.setItem('looseKromer', looseKromer);
    updateHUD();
}

function saveToCard() {
    if (looseKromer <= 0) {
        alert("YOUR POCKETS ARE [[Empty]]! ACTIVE THE MINE FUNCTION TO GATHER [[Kromer]] FIRST!");
        return;
    }
    cardBalance += looseKromer;
    looseKromer = 0;
    localStorage.setItem('looseKromer', looseKromer);
    localStorage.setItem('cardBalance', cardBalance);
    updateHUD();
    alert("SUCCESS! [[Kromer]] SECURELY ENCRYPTED INTO PLASTIC ARCHIVE.");
}

function updateHUD() {
    const looseEl = document.getElementById('looseKromer');
    const balanceEl = document.getElementById('cardBalance');
    if (looseEl) looseEl.innerText = looseKromer;
    if (balanceEl) balanceEl.innerText = "$" + cardBalance;
}

// --- 3. DYNAMIC REWRITING OVERRIDE ---
// This hooks into your original slide function to read card balance levels dynamically
function insertCard() {
    const card = document.getElementById('spamtonCard');
    if (card) card.classList.add('card-swallowed');
    
    setTimeout(() => {
        if (cardBalance <= 0) {
            alert("...WAIT A SEC. THIS CARD HAS [[$0.00]] Balance?! YOU ARE TRYING TO SCAM THE SALESMAN! GET OUT OF THE SYSTEM!");
        } else if (cardBalance > 0 && cardBalance < 100) {
            alert("THANK YOU FOR THE DEPOSIT! YOUR VALUE OF [$" + cardBalance + "] HAS BEEN EXCHANGED FOR POOR QUALITY CAR INSURANCE.");
        } else if (cardBalance >= 100 && cardBalance < 1000) {
            alert("HAEAEAEAEAEA!!! NOW THAT'S WHAT I CALL A [$" + cardBalance + "] GENEROSITY!! YOU'RE TURNING INTO A REAL [[Big Shot]]!");
        } else {
            alert("🚨 ALARMS BLARING 🚨\n\nUNBELIEVABLE! [$" + cardBalance + "] KROMER DELIVERED DIRECTLY INTO THE DUMPSTER! YOU HAVE BROKEN THE CYBER ECONOMY!!!");
        }
        
        cardBalance = 0;
        localStorage.setItem('cardBalance', cardBalance);
        updateHUD();
        
        // Return back to main menu
        if (typeof showStage === "function") showStage('menuStage');
        else if (typeof changeScreen === "function") changeScreen('menuScreen');
    }, 550);
}

// Boot setup automatically once page assets settle
window.addEventListener('DOMContentLoaded', injectEconomyHUD);
</script>
